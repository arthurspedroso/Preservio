services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: preservio
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: preservio_db
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U preservio -d preservio_db']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://preservio:devpassword@db:5432/preservio_db
      JWT_SECRET: dev-only-secret-change-me-in-production
      JWT_EXPIRES_IN: 1d
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
